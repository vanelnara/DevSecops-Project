global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: pushgateway
    honor_labels: true
    metrics_path: /metrics
    static_configs:
      - targets: ["pushgateway:9091"]
        labels:
          component: metrics-ingest

  - job_name: cadvisor
    metrics_path: /metrics
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          component: containers

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          component: monitoring

  # Requires Jenkins "Prometheus metrics" plugin → /prometheus
  - job_name: jenkins
    metrics_path: /prometheus
    scrape_timeout: 10s
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          component: ci

  # After: kubectl apply -k k8s/monitoring/
  - job_name: k8s-node-exporter
    scrape_timeout: 10s
    static_configs:
      - targets: ["host.docker.internal:31000"]
        labels:
          cluster: lab
          component: node

  - job_name: k8s-kube-state-metrics
    scrape_timeout: 10s
    static_configs:
      - targets: ["host.docker.internal:31080"]
        labels:
          cluster: lab
          component: kubernetes
