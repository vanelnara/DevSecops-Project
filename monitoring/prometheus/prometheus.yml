global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# CORE targets (always expected UP on the Jenkins Docker host).
# Optional Jenkins + Kubernetes scrapes live in scrape-optional.yml —
# enable them only after those endpoints respond (see docs/GRAFANA_SETUP.md).

scrape_configs:
  - job_name: pushgateway
    honor_labels: true
    metrics_path: /metrics
    static_configs:
      - targets: ["pushgateway:9091"]
        labels:
          component: metrics-ingest

  - job_name: cadvisor
    metrics_path: /metrics
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          component: containers

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          component: monitoring
