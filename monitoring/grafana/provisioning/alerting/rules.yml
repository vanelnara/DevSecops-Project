apiVersion: 1

groups:
  - orgId: 1
    name: DevSecOps pipeline
    folder: DevSecOps
    interval: 1m
    rules:
      - uid: jenkins_build_failed
        title: Jenkins pipeline hard-failed
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: max(devsecops_jenkins_build_failed{job_name="Devops-project"}) == 1
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
        noDataState: OK
        execErrState: OK
        for: 1m
        annotations:
          summary: Latest Jenkins pipeline hard-failed
          description: The replaceable latest metric reports failed=1. Check Jenkins console and SentinelOps for the current build.
        labels:
          severity: critical
        isPaused: false

      - uid: high_container_cpu
        title: High container CPU (cAdvisor)
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                topk(1,
                  sum by (name) (rate(container_cpu_usage_seconds_total{name=~".+"}[5m]))
                ) > 1.5
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
        noDataState: OK
        execErrState: OK
        for: 5m
        annotations:
          summary: A container is sustaining high CPU
          description: Review cAdvisor / Docker on the Jenkins host.
        labels:
          severity: warning
        isPaused: false

      - uid: high_container_memory
        title: High container memory working set
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                max by (name) (
                  container_memory_working_set_bytes{name=~"devsecops-.*|jenkins|sonarqube"}
                ) > 2.5e9
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
        noDataState: OK
        execErrState: OK
        for: 5m
        annotations:
          summary: A lab container is using > ~2.5GiB RAM
          description: Investigate memory growth on the Jenkins Docker host.
        labels:
          severity: warning
        isPaused: false

      - uid: monitoring_target_down
        title: Critical scrape target down
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: up{job=~"pushgateway|cadvisor|prometheus"} == 0
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
        noDataState: OK
        execErrState: OK
        for: 2m
        annotations:
          summary: A core monitoring scrape target is down
          description: Check docker compose for prometheus / pushgateway / cadvisor.
        labels:
          severity: critical
        isPaused: false
