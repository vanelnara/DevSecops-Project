sonar.projectKey=devsecops-simple-shop
sonar.projectName=DevSecOps Simple Shop
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Analyze application code (not infra / generated assets)
sonar.sources=\
microservice/server,\
security-dashboard/server,\
security-dashboard/src,\
services/ingest-bridge/src,\
services/ai-analyzer/src

sonar.tests=microservice/tests
sonar.test.inclusions=microservice/tests/**/*.js

sonar.javascript.file.suffixes=.js,.jsx,.mjs,.cjs
sonar.typescript.file.suffixes=.ts,.tsx

# Coverage from `npm run test:coverage` in microservice/ (LCOV)
sonar.javascript.lcov.reportPaths=microservice/coverage/lcov.info
sonar.coverage.exclusions=\
**/node_modules/**,\
**/coverage/**,\
**/data/**,\
**/public/**,\
**/scripts/**,\
**/*.test.js,\
**/tests/**

sonar.exclusions=\
**/node_modules/**,\
**/coverage/**,\
**/dist/**,\
**/build/**,\
**/.vite/**,\
**/reports/**,\
**/.git/**,\
**/k8s/**,\
**/ansible/**,\
**/monitoring/**,\
**/docs/**,\
**/*.min.js,\
**/package-lock.json,\
microservice/server/data/**

# CPD / noise control
sonar.cpd.exclusions=**/data/**,**/tests/**

# Keep SCM blame optional on lab agents without full git metadata
sonar.scm.disabled=false
