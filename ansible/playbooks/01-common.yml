---
# Baseline packages on Jenkins (and optionally k8s) hosts
- name: Common baseline
  hosts: jenkins:k8s
  become: true
  tasks:
    - name: Ensure apt cache is updated (Debian family)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Install common packages (Debian family)
      ansible.builtin.apt:
        name:
          - curl
          - git
          - ca-certificates
          - gnupg
          - python3
          - python3-pip
          - unzip
          - jq
          - net-tools
        state: present
      when: ansible_os_family == "Debian"

    - name: Reminder — set hostname / firewall next
      ansible.builtin.debug:
        msg: >-
          Baseline packages installed on {{ inventory_hostname }}.
          Next: run 02-jenkins-agent-tools.yml on the jenkins group,
          then complete Jenkins UI setup in docs/JENKINS_SETUP.md.
