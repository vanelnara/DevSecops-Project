apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-analyzer
  namespace: devsecops
  labels:
    app: ai-analyzer
    app.kubernetes.io/part-of: sentinelops
spec:
  replicas: 1
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app: ai-analyzer
  template:
    metadata:
      labels:
        app: ai-analyzer
    spec:
      containers:
        - name: ai-analyzer
          image: sneproject/devsecops-ai:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4300
              name: http
          env:
            - name: AI_PORT
              value: "4300"
            - name: AI_PROVIDER
              value: huggingface
            - name: HUGGINGFACE_MODEL
              value: Qwen/Qwen2.5-7B-Instruct:fastest
            - name: HUGGINGFACE_API_URL
              value: https://router.huggingface.co/v1/chat/completions
            - name: HUGGINGFACE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: huggingface-api-key
                  key: token
                  optional: true
            - name: JENKINS_DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: sentinelops-config
                  key: JENKINS_DB_HOST
                  optional: true
            - name: JENKINS_DB_PORT
              value: "5432"
            - name: JENKINS_DB_NAME
              value: jenkins
            - name: JENKINS_DB_USER
              value: jenkins
            - name: JENKINS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jenkins-db-password
                  key: password
                  optional: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 8
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
