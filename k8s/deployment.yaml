apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-shop
  namespace: devsecops
  labels:
    app: simple-shop
spec:
  # Single replica avoids stuck rollouts on small lab clusters where 2 pods
  # cannot schedule (maxUnavailable rounds to 0 with replicas=2).
  replicas: 1
  progressDeadlineSeconds: 300
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: simple-shop
  template:
    metadata:
      labels:
        app: simple-shop
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: simple-shop
          image: sneproject/devsecops-project:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: production
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
