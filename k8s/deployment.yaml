apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-shop
  namespace: devsecops
  labels:
    app: simple-shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: simple-shop
  template:
    metadata:
      labels:
        app: simple-shop
    spec:
      containers:
        - name: simple-shop
          image: sneproject/devsecops-project:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
