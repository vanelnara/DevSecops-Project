apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devsecops-dashboard
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: sentinelops
  finalizers:
    - argocd.argoproj.io/resources-finalizer
spec:
  project: default
  source:
    repoURL: https://github.com/vanelnara/DevSecops-Project.git
    targetRevision: main
    path: k8s/dashboard
  destination:
    server: https://kubernetes.default.svc
    namespace: devsecops
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
